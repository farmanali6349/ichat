services:
  app:
    build:
      context: .
      args:
        # Supply at build time, e.g.:
        #   VITE_CLERK_PUBLISHABLE_KEY=pk_... docker compose up -d --build
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    image: chat-app:latest
    ports:
      # Host port is configurable: APP_PORT=80 on the server, default 3001 locally.
      - "${APP_PORT:-3001}:3001"
    env_file:
      - .env.prod
    restart: unless-stopped
